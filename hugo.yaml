baseURL: https://sctpeter.github.io/
defaultContentLanguage: zh
# 中文在根路径（/posts/...），英文在 /en/ 下
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
# 只保留分类，不使用标签
taxonomies:
  category: categories
theme: PaperMod

params:
  env: production
  ShowFullTextinRSS: true
  ShowRssButtonInSectionTermList: true
  # 文章顶部显示所在层级（如 HPC › 计算机网络 › 网络基础）
  ShowBreadCrumbs: true
  # 语言切换按钮显示 “中文 / English” 而不是 “Zh / En”
  displayFullLangName: true
  comments: true
  # GitHub 登录评论（utterances），需在仓库安装 https://github.com/apps/utterances
  # issueTerm 为 pathname 时，中英文页面路径不同，评论各自独立
  utterances:
    repo: sctpeter/sctpeter.github.io
    issueTerm: pathname
    label: comment
  ShowReadingTime: true
  # 访问统计（GoatCounter），后台：https://sctpeter.goatcounter.com
  # 只在生产构建（hugo / GitHub Actions）中加载，本地 hugo server 不计数
  # 文章阅读次数需在后台 Settings 勾选 “Allow adding visitor counts on your website”，否则不显示；没有访问记录时显示 0
  # GoatCounter 服务端会缓存计数约 4 小时，文章里的阅读次数比后台数字滞后
  goatcounter: sctpeter
  ShowCodeCopyButtons: true

