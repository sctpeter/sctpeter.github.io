baseURL: https://sctpeter.github.io/
defaultContentLanguage: zh
languages:
  zh:
    locale: zh-CN
    label: 中文
title: 个人博客
enableRobotsTXT: true
theme: PaperMod

params:
  env: production
  ShowFullTextinRSS: true
  ShowRssButtonInSectionTermList: true
  comments: true
  # GitHub 登录评论（utterances），需在仓库安装 https://github.com/apps/utterances
  utterances:
    repo: sctpeter/sctpeter.github.io
    issueTerm: pathname
    label: comment
  ShowReadingTime: true
  ShowCodeCopyButtons: true

  profileMode:
    enabled: true
    title: sctpeter
    subtitle: 浙江大学大三 · ZJUSCT 队员 · 关注 HPC-AI
    imageUrl: https://github.com/sctpeter.png
    imageTitle: avatar
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: 文章
        url: posts/
      - name: 归档
        url: archives/
      - name: 分类
        url: categories/
      - name: 标签
        url: tags/
      - name: 个人简介
        url: about/

  socialIcons:
    - name: github
      url: https://github.com/sctpeter
    - name: email
      url: mailto:sctpeter528@gmail.com
    - name: rss
      url: https://sctpeter.github.io/posts/index.xml

menu:
  main:
    - name: 文章
      url: posts/
      weight: 10
    - name: 归档
      url: archives/
      weight: 20
    - name: 分类
      url: categories/
      weight: 25
    - name: 标签
      url: tags/
      weight: 30
    - name: 个人简介
      url: about/
      weight: 40
