baseURL: https://sctpeter.github.io/
defaultContentLanguage: zh
# 中文在根路径（/posts/...），英文在 /en/ 下
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
theme: PaperMod

params:
  env: production
  ShowFullTextinRSS: true
  ShowRssButtonInSectionTermList: true
  # 语言切换按钮显示 “中文 / English” 而不是 “Zh / En”
  displayFullLangName: true
  comments: true
  # GitHub 登录评论（utterances），需在仓库安装 https://github.com/apps/utterances
  # issueTerm 为 pathname 时，中英文页面路径不同，评论各自独立
  utterances:
    repo: sctpeter/sctpeter.github.io
    issueTerm: pathname
    label: comment
  ShowReadingTime: true
  ShowCodeCopyButtons: true

languages:
  zh:
    locale: zh-CN
    label: 中文
    weight: 1
    title: 个人博客
    params:
      # 邮件订阅（follow.it）：订阅表单的 action 地址，留空则文章末尾只显示 RSS
      followit:
        formAction: "https://api.follow.it/subscription-form/bURLL0RLTS9OU0NSZHRuZ05rYndHd2E2NFdHRjZLQjBrQUZ0N2FOWTV6cEYweTZhdmV3bi9sUmwzZHk2WVFkdXJzVnlMbW8wQVg3VUc0WGxGZVpHTmVOeTIyUUhEOUNsSE85YlpnaDB4N3dicEY5OVhxNHpPZnRsejdmTTdXQWp8QnUyNEEvKzUvekZVWTd3YkJQN1NidDhoaU9LdkFpWmRDMU50UFpuRHByTT0=/8"
      profileMode:
        enabled: true
        title: sctpeter
        subtitle: 浙江大学大三 · ZJUSCT 队员 · 关注 HPC-AI
        imageUrl: https://github.com/sctpeter.png
        imageTitle: avatar
        imageWidth: 120
        imageHeight: 120
        buttons:
          - name: 文章
            url: posts/
          - name: 归档
            url: archives/
          - name: 分类
            url: categories/
          - name: 标签
            url: tags/
          - name: 个人简介
            url: about/
      socialIcons:
        - name: github
          url: https://github.com/sctpeter
        - name: email
          url: mailto:sctpeter528@gmail.com
        - name: rss
          url: https://sctpeter.github.io/posts/index.xml
    menus:
      main:
        - name: 文章
          url: posts/
          weight: 10
        - name: 归档
          url: archives/
          weight: 20
        - name: 分类
          url: categories/
          weight: 25
        - name: 标签
          url: tags/
          weight: 30
        - name: 个人简介
          url: about/
          weight: 40

  en:
    locale: en-US
    label: English
    weight: 2
    title: sctpeter's Blog
    params:
      # 英文订阅源（/en/posts/index.xml）在 follow.it 登记后，把表单地址填在这里
      followit:
        formAction: ""
      profileMode:
        enabled: true
        title: sctpeter
        subtitle: Junior at Zhejiang University · ZJUSCT member · Focused on HPC-AI
        imageUrl: https://github.com/sctpeter.png
        imageTitle: avatar
        imageWidth: 120
        imageHeight: 120
        buttons:
          - name: Posts
            url: posts/
          - name: Archives
            url: archives/
          - name: Categories
            url: categories/
          - name: Tags
            url: tags/
          - name: About
            url: about/
      socialIcons:
        - name: github
          url: https://github.com/sctpeter
        - name: email
          url: mailto:sctpeter528@gmail.com
        - name: rss
          url: https://sctpeter.github.io/en/posts/index.xml
    menus:
      main:
