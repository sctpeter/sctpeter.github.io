{{- /* 文章末尾订阅框：RSS */ -}}
{{- if and (eq .Kind "page") (eq .Section "posts") }}
<div class="subscribe-box">
  <p class="subscribe-title">订阅更新</p>
  <p class="subscribe-rss">
    用 RSS 阅读器订阅：<a href="{{ "posts/index.xml" | absURL }}" target="_blank" rel="noopener">{{ "posts/index.xml" | absURL }}</a>
  </p>
</div>
<style>
  .subscribe-box { margin-top: 40px; padding: 18px 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--entry); }
  .subscribe-box .subscribe-title { font-weight: 600; margin-bottom: 10px; }
  .subscribe-box .subscribe-rss { font-size: 14px; color: var(--secondary); word-break: break-all; margin: 0; }
</style>
{{- end }}
